<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trent Park Lawn Club — Pool Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #0B3339;
    --deep:     #145C66;
    --aqua:     #4FC7DA;
    --foam:     #F3F7F5;
    --sand:     #D8C39C;
    --coral:    #E2795A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, var(--deep), var(--ink) 60%);
    font-family:'IBM Plex Mono', 'PingFang SC', 'Microsoft YaHei', monospace, sans-serif;
    color:var(--foam);
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  .card{
    position:relative;
    width:min(520px, 92vw);
    padding:56px 40px 40px;
    text-align:center;
    z-index:2;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--sand);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', 'PingFang SC', 'Microsoft YaHei', serif, sans-serif;
    font-weight:300;
    font-optical-sizing:auto;
    font-size:clamp(20px, 4vw, 26px);
    margin:0 0 34px;
    color:var(--foam);
  }
  .hero-number{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(96px, 26vw, 168px);
    line-height:1;
    color:var(--aqua);
    text-shadow:0 0 40px rgba(79,199,218,.35);
    transition:transform .4s ease;
  }
  .hero-number.bump{ transform:scale(1.06); }
  .hero-label{
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--foam);
    opacity:.75;
    margin-top:4px;
  }
  .split{
    display:flex;
    justify-content:center;
    gap:0;
    margin-top:36px;
    border-top:1px solid rgba(243,247,245,.15);
    padding-top:28px;
  }
  .stat{ flex:1; }
  .stat + .stat{ border-left:1px solid rgba(243,247,245,.15); }
  .stat .num{
    font-size:clamp(28px, 6vw, 40px);
    font-weight:500;
    color:var(--foam);
  }
  .stat.guests .num{ color:var(--coral); }
  .stat.children .num{ color:var(--sand); }
  .stat .lbl{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.6;
    margin-top:4px;
  }
  .updated{
    margin-top:32px;
    font-size:11px;
    opacity:.5;
  }
  .updated.stale{ color:var(--coral); opacity:.85; }

  .forms-section{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid rgba(243,247,245,.15);
    display:flex;
    justify-content:center;
    gap:24px;
    flex-wrap:nowrap;
  }
  .form-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
    min-width:0;
    max-width:145px;
  }
  .form-card img{
    width:72px;
    height:72px;
    border-radius:8px;
    background:var(--foam);
    padding:5px;
  }
  .form-card .form-label{
    margin-top:10px;
    font-size:clamp(11px, 3.6vw, 15px);
    letter-spacing:.02em;
    color:var(--foam);
    opacity:.9;
    text-align:center;
    line-height:1.4;
  }
  .blink-link{
    color:var(--coral);
    text-decoration:none;
    font-weight:600;
    animation:blinkLink 1s step-start infinite;
  }
  .blink-link:hover{ text-decoration:underline; }
  @keyframes blinkLink{ 50%{ opacity:0; } }

  .lang-toggle{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    border:1px solid rgba(243,247,245,.3);
    border-radius:999px;
    overflow:hidden;
    z-index:3;
  }
  .lang-toggle button{
    font-family:'IBM Plex Mono', 'PingFang SC', 'Microsoft YaHei', monospace, sans-serif;
    font-size:11px;
    letter-spacing:.08em;
    background:transparent;
    color:var(--foam);
    opacity:.6;
    border:none;
    padding:6px 14px;
    cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--aqua);
    color:var(--ink);
    opacity:1;
    font-weight:600;
  }

  /* ripple / wave signature at the base of the page */
  .waves{
    position:fixed;
    left:0; right:0; bottom:0;
    height:140px;
    z-index:1;
    opacity:.5;
  }
  .waves path{ fill:var(--deep); }
  .waves .w2{ fill:var(--ink); opacity:.8; }

  .site-footer{
    position:fixed;
    left:0; right:0;
    bottom:8px;
    text-align:center;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--foam);
    opacity:.4;
    z-index:2;
  }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .wave-track{
    width:200%;
    height:100%;
    display:flex;
    animation:drift 18s linear infinite;
  }
  .wave-track svg{ width:50%; height:100%; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    .wave-track{ animation:none; }
    .hero-number{ transition:none; }
    .blink-link{ animation:none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="lang-toggle">
      <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      <button id="lang-zh" onclick="setLang('zh')">中文</button>
    </div>

    <div class="eyebrow" data-i18n="clubName">Trent Park Lawn Club</div>
    <h1 data-i18n="heading">People at the pool right now</h1>

    <div class="hero-number" id="total">–</div>
    <div class="hero-label" data-i18n="heroLabel">in the pool area</div>

    <div class="split">
      <div class="stat residents">
        <div class="num" id="residents">–</div>
        <div class="lbl" data-i18n="residents">Residents</div>
      </div>
      <div class="stat guests">
        <div class="num" id="adultGuests">–</div>
        <div class="lbl" data-i18n="adultGuests">Adult Guests</div>
      </div>
      <div class="stat children">
        <div class="num" id="children">–</div>
        <div class="lbl" data-i18n="children">Children</div>
      </div>
    </div>

    <div class="updated" id="updated">Loading…</div>

    <div class="forms-section">
      <div class="form-card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https%3A%2F%2Fforms.gle%2FPFBNPmBprpW7B1cV8" alt="Sign-in form QR code">
        <div class="form-label">
          <span data-i18n="signInPrefix">Sign in with QR code or</span>
          <a href="https://forms.gle/PFBNPmBprpW7B1cV8" target="_blank" class="blink-link" data-i18n="clickHere">click here</a>.
        </div>
      </div>
      <div class="form-card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https%3A%2F%2Fforms.gle%2F44q7aepvs9hbm4Fz5" alt="Request pre-filled link form QR code">
        <div class="form-label">
          <span data-i18n="prefillPrefix">Get bookmark for pre-filled form or</span>
          <a href="https://forms.gle/44q7aepvs9hbm4Fz5" target="_blank" class="blink-link" data-i18n="clickHere">click here</a>.
        </div>
      </div>
    </div>
  </div>

  <div class="waves">
    <div class="wave-track">
      <svg viewBox="0 0 800 140" preserveAspectRatio="none"><path class="w2" d="M0,60 C150,120 350,0 500,60 C650,120 750,20 800,60 L800,140 L0,140 Z"/></svg>
      <svg viewBox="0 0 800 140" preserveAspectRatio="none"><path class="w2" d="M0,60 C150,120 350,0 500,60 C650,120 750,20 800,60 L800,140 L0,140 Z"/></svg>
    </div>
  </div>

  <div class="site-footer">App design by Tudor Designs</div>

<script>
  // Paste the "Publish to web" CSV URL for the public spreadsheet's
  // "Counts" tab here.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxnkryb-seYb4kijqbYnNcMKzBqk4wAeb8upnhMaFuphon_3VNDCeCdm2csLD1YaORHQS9qXXxR_nG/pub?gid=1539529397&single=true&output=csv";

  const REFRESH_MS = 20000;
  let lastTotal = null;
  let lastUpdatedRaw = "";
  let currentLang = "en";

  const I18N = {
    en: {
      clubName: "Trent Park Lawn Club",
      heading: "People at the pool right now",
      heroLabel: "in the pool area",
      residents: "Residents",
      adultGuests: "Adult Guests",
      children: "Children",
      lastUpdated: "Last updated",
      justNow: "just now",
      error: "Couldn't reach the live count — retrying…",
      signInPrefix: "Sign in with QR code or",
      prefillPrefix: "Get bookmark for pre-filled form or",
      clickHere: "click here"
    },
    zh: {
      clubName: "特伦特公园草坪俱乐部",
      heading: "泳池当前人数",
      heroLabel: "在泳池区域",
      residents: "住户",
      adultGuests: "成人客人",
      children: "儿童",
      lastUpdated: "最后更新",
      justNow: "刚刚",
      error: "无法获取实时数据 — 正在重试…",
      signInPrefix: "扫描二维码签到，或",
      prefillPrefix: "获取预填表格书签，或",
      clickHere: "点击此处"
    }
  };

  function setLang(lang){
    currentLang = lang;
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    document.getElementById("lang-zh").classList.toggle("active", lang === "zh");
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = I18N[lang][el.getAttribute("data-i18n")];
    });
    updateUpdatedText();
  }

  function updateUpdatedText(){
    const updatedEl = document.getElementById("updated");
    if(updatedEl.classList.contains("stale")){
      updatedEl.textContent = I18N[currentLang].error;
    } else {
      updatedEl.textContent = I18N[currentLang].lastUpdated + " " + (lastUpdatedRaw || I18N[currentLang].justNow);
    }
  }

  function parseCsv(text){
    const lines = text.trim().split("\n").map(l => l.split(",").map(c => c.trim()));
    const [, dataRow] = lines; // row 0 = header, row 1 = values
    return {
      residents: parseInt(dataRow[0], 10) || 0,
      adultGuests: parseInt(dataRow[1], 10) || 0,
      children: parseInt(dataRow[2], 10) || 0,
      total: parseInt(dataRow[3], 10) || 0,
      updated: dataRow[4] || ""
    };
  }

  async function refresh(){
    try{
      const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
      if(!res.ok) throw new Error("Fetch failed");
      const { residents, adultGuests, children, total, updated } = parseCsv(await res.text());

      document.getElementById("residents").textContent = residents;
      document.getElementById("adultGuests").textContent = adultGuests;
      document.getElementById("children").textContent = children;

      const totalEl = document.getElementById("total");
      totalEl.textContent = total;
      if(lastTotal !== null && total !== lastTotal){
        totalEl.classList.add("bump");
        setTimeout(() => totalEl.classList.remove("bump"), 400);
      }
      lastTotal = total;

      lastUpdatedRaw = updated;
      document.getElementById("updated").classList.remove("stale");
      updateUpdatedText();
    }catch(err){
      document.getElementById("updated").classList.add("stale");
      updateUpdatedText();
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);

  // Basic deterrents against casual copying — right-click and a few common
  // shortcuts. Note: this cannot stop anyone determined (e.g. via browser
  // dev tools), since the page's HTML/CSS/JS must be readable by the
  // browser to run at all. It only discourages casual copy-paste.
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    const blockedCombo =
      (e.ctrlKey || e.metaKey) && (k === "u" || k === "s" || (e.shiftKey && k === "i"));
    if (k === "f12" || blockedCombo) e.preventDefault();
  });
</script>
</body>
</html>
